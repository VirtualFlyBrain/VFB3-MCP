name: Docker Image CI

on:
  push:
    branches: '**'
    tags: 'v*'
  pull_request:
    branches: [ main ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # On a release tag, force the in-image version to match the tag so the
    # running server, package.json and server.json all report the released
    # version (VERSION in src is read from package.json). Non-tag builds keep
    # the committed version. Mirrors the version step in publish-mcp.yml.
    - name: Set version from release tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "Forcing version to $VERSION"
        jq --arg v "$VERSION" '.version = $v' package.json > package.tmp && mv package.tmp package.json
        jq --arg v "$VERSION" '.version = $v' server.json  > server.tmp  && mv server.tmp  server.json

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: virtualflybrain/vfb3-mcp
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max